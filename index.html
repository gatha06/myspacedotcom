<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myspacedotcom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="#" class="logo">myspace<span>dotcom</span></a>
    <input type="search" id="search" placeholder="Search your pins" aria-label="Search your pins">
    <button type="button" id="create-btn" class="btn">+ Create</button>
  </header>

  <section class="profile">
    <div class="avatar" id="avatar" aria-hidden="true">?</div>
    <h1 id="name" contenteditable="true" spellcheck="false" aria-label="Your name (click to edit)">Your Name</h1>
    <p id="bio" class="bio" contenteditable="true" spellcheck="false" aria-label="Your bio (click to edit)">Click here to write your bio.</p>
    <p class="mood">Mood today: <strong id="current-mood"></strong></p>
    <div id="mood-picker" class="mood-picker" role="group" aria-label="Pick your mood"></div>
  </section>

  <nav class="filters" id="filters" aria-label="Filter pins">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="photo" aria-pressed="false">Photos</button>
    <button type="button" data-filter="note" aria-pressed="false">Notes</button>
    <button type="button" data-filter="link" aria-pressed="false">Links</button>
  </nav>

  <main>
    <ul id="feed" class="feed"></ul>
  </main>

  <!-- Create a pin -->
  <dialog id="create-dialog" class="modal" aria-label="Create a pin">
    <form id="create-form">
      <h2>Create a pin</h2>

      <div class="types" role="radiogroup" aria-label="Pin type">
        <label><input type="radio" name="type" value="photo" checked>Photo</label>
        <label><input type="radio" name="type" value="note">Note</label>
        <label><input type="radio" name="type" value="link">Link</label>
      </div>

      <div class="fields" data-type="photo">
        <input type="file" id="photo-input" accept="image/*" multiple aria-label="Choose photos">
      </div>

      <div class="fields" data-type="note" hidden>
        <input type="text" id="note-title" placeholder="Title (optional)" maxlength="60">
        <textarea id="note-text" placeholder="Write a note..." rows="4"></textarea>
      </div>

      <div class="fields" data-type="link" hidden>
        <select id="link-platform" aria-label="Platform">
          <option value="GitHub">🐙 GitHub</option>
          <option value="LinkedIn">💼 LinkedIn</option>
          <option value="Instagram">📸 Instagram</option>
          <option value="X">🐦 X</option>
          <option value="YouTube">▶️ YouTube</option>
          <option value="Website">🌐 Website</option>
        </select>
        <input type="text" id="link-url" placeholder="Paste your link">
      </div>

      <p id="create-error" class="form-error" role="alert"></p>

      <div class="modal-actions">
        <button type="button" id="create-cancel" class="btn ghost">Cancel</button>
        <button type="submit" class="btn">Save pin</button>
      </div>
    </form>
  </dialog>

  <!-- Photo viewer -->
  <dialog id="viewer" class="viewer" aria-label="Photo viewer">
    <img id="viewer-img" alt="Enlarged photo">
    <button type="button" id="viewer-close" class="viewer-close" aria-label="Close photo">✕</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
