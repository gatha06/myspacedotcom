<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myspacedotcom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>myspacedotcom</h1>
    <nav>
      <a href="#about">About</a>
      <a href="#notes">Notes</a>
      <a href="#gallery">Gallery</a>
      <a href="#socials">Socials</a>
    </nav>
  </header>

  <main>
    <!-- Profile card -->
    <section class="profile-card" id="about">
      <img src="" alt="Profile picture" class="avatar">
      <h2>Your Name</h2>
      <p class="bio">A short bio about you goes here.</p>
      <p class="mood">Mood today: <span id="current-mood">😊 happy</span></p>
    </section>

    <!-- Notes -->
    <section id="notes">
      <h2>Notes</h2>
      <p>Notes will go here.</p>
    </section>

    <!-- Gallery -->
    <section id="gallery">
      <h2>Gallery</h2>
      <p>Photos will go here.</p>
    </section>

    <!-- Socials -->
    <section id="socials">
      <h2>Socials</h2>
      <p>Links will go here.</p>
    </section>
  </main>

  <footer>
    <p>© myspacedotcom</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
